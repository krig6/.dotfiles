[keyboard]
bindings = [
{ key = "Q", mods = "Control", command = { program = "bash", args = [ "-c", "~/.tmux_startup.sh"] } },
{ key = "V", mods = "Control", action = "Paste" },
{ key = "Plus", mods = "Control", action = "IncreaseFontSize"},
{ key = "Minus", mods = "Control", action = "DecreaseFontSize"},
# { key = "W", mods = "Control", action = "Quit"}
{ key = "W", mods = "Control", command = { program = "bash", args = ["-c", "tmux kill-session -t $(tmux list-sessions -F '#{session_name}' | tail -n 1); pkill -f alacritty"] } }
]
