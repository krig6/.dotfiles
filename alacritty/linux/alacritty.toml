import = [
   "~/.config/alacritty/gruvbox.toml",
  # "~/.config/alacritty/tokyonight_night.toml",
  # "~/.config/alacritty/tokyonight_day.toml",
  # "~/.config/alacritty/solarized_osaka.toml"
  "~/.config/alacritty/keybindings.toml"
]

live_config_reload = true

[font]
normal = { family = "Hack Nerd Font", style = "Regular" }
# normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
# normal = { family = "FiraCode Nerd Font", style = "Regular" }
size = 13

[font.offset]
y = 3

[font.glyph_offset]
y = 3

[window]
startup_mode = "Windowed" # Maximized, Fullscreen
decorations = "Full" # Full
dimensions = { columns = 150, lines = 37}
position = {x = 220, y = 55}
dynamic_padding = false
opacity = 0.9

[cursor]
unfocused_hollow = true

[cursor.style]
blinking = "Never"

[env]
TERM = "xterm-256color"

[scrolling]
history = 2000

