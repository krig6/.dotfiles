unbind C-b
unbind (
unbind )
set -g prefix C-f  # Set new prefix to Ctrl + F

# Create new window using Ctrl + N
bind-key -n C-n new-window

# Split window horizontally with Ctrl + T
bind-key -n C-t split-window -h

set -g base-index 1  # Start window numbering from 1
set -g pane-base-index 1  # Start pane numbering from 1
setw -g pane-base-index 1  # Apply to all windows

bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9

set -sg escape-time 1
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:Tc"

set -g mouse on

bind C-q run-shell "bash ~/.tmux_startup.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'

# Initialize TPM (keep this line at the bottom)
run '~/.tmux/plugins/tpm/tpm'


