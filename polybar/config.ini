;

######################################
#######    Date/Time Gradient  #######

[module/text1]
type = custom/text
format = ""
format-foreground= ${gradient.color-3}
format-font = 3

[module/text2]
type = custom/text
format= ""
format-foreground= ${gradient.color-3}
format-font = 10

[module/text3]
type = custom/text
format= ""
format-foreground= ${gradient.color-3}
format-font = 3

[module/text4]
type = custom/text
format= ""
format-foreground= ${gradient.color-3}
format-font = 3

[module/text5]
type = custom/text
format= ""
format-foreground= ${gradient.color-3}
format-font = 3

[module/text6]
type = custom/text
format= ""
format-foreground= ${gradient.color-3}
format-font = 3

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = " %date% "
label-foreground = ${colors.disabled}
label-background = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

