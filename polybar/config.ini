[colors]
background = #282828
background-alt = #1d2021
foreground = #a89984
primary = #d79921
secondary = #689d6a
alert = #cc241d
disabled = #504945

# This is to set the distance between the modules
[padding]
modules = 20px

# Gradient Set-up
[gradient]
color-1 = ${colors.disabled}
color-2 = #cc241d
color-3 = ${colors.primary}

[bar/top]
width = 100%
height = 30 pt
radius = 10

border-color = #00000000
border-left-size = 15
border-right-size = 15
border-top-size = 5

override-redirect = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

padding-left = 1
padding-right = 1

module-margin = 0

font-0 = Hack Nerd Font:pixelsize=17;4

modules-left = powermenu
modules-center = text1 text2 text3 date text4 text5 text6
modules-right = pulseaudio memory cpu

enable-ipc = true

; [module/xwindow]
; type = internal/xwindow
; label = %title:0:60:...%

[module/powermenu]
type = custom/menu
label-open = "  " 
label-open-foreground = ${colors.primary}
label-close = "Cancel"
label-close-foreground = ${gradient.color-2}
label-close-padding-right = 1
menu-0-0 = "Shutdown"
menu-0-0-exec = systemctl poweroff
menu-0-0-padding-right = 1
menu-0-0-foreground = ${colors.secondary}
menu-0-1 = "Restart"
menu-0-1-exec = systemctl reboot
menu-0-1-padding-right = 1
menu-0-1-foreground = ${colors.secondary}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}

label-volume = %percentage%%
label-volume-padding-left= 1
label-volume-padding-right= 2

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
 type = internal/memory
 interval = 2

 format-prefix = "RAM"
 format-prefix-foreground = ${colors.primary}

 label= %percentage_used%%
 label-padding-left= 1
 label-padding-right= 2

[module/cpu]
 type = internal/cpu
 interval = 2

 format-prefix= "CPU"
 format-prefix-foreground = ${colors.primary}

 label= %percentage%%
 label-padding-left= 1
 label-padding-right= 2

; [network-base]
; type = internal/network
; interval = 5
; format-connected = <label-connected>
; format-disconnected = <label-disconnected>
; label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected
;
; [module/wlan]
