; Start of color definitions
[colors]
background = #00000000
foreground = #e0def4
primary = #312f4f
secondary = #f6c177
alert = #eb6f92
disabled = #ebbcba
; End of color definitions

[padding]
modules = 20px

[bar/top]
width = 100%
height = 30 pt
monitor = HDMI-0


background = ${colors.background}
foreground = ${colors.foreground}

module-margin = 0
border-left-size = 15
border-right-size = 15
border-top-size = 5
padding-left = 1
padding-right = 1

font-0 = Hack Nerd Font:pixelsize=17;4

modules-left = powermenu
modules-center = text1 text2 text3 date text4 text5 text6
modules-right = pulseaudio memory cpu

enable-ipc = true

[module/powermenu]
type = custom/menu
label-open = "  " 
label-open-foreground = ${colors.disabled}
label-close = "Cancel"
label-close-foreground = ${colors.disabled}
label-close-padding-right = 1
menu-0-0 = "Shutdown"
menu-0-0-exec = systemctl poweroff
menu-0-0-padding-right = 1
menu-0-0-foreground = ${colors.disabled}
menu-0-1 = "Restart"
menu-0-1-exec = systemctl reboot
menu-0-1-padding-right = 1
menu-0-1-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.disabled}
label-volume = %percentage%%
label-volume-foreground = ${colors.disabled}
label-volume-padding-left= 1
label-volume-padding-right= 2
label-muted = " muted "
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM"
format-prefix-foreground = ${colors.disabled}
label= %percentage_used%%
label-foreground = ${colors.disabled}
label-padding-left= 1
label-padding-right= 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix= "CPU"
format-prefix-foreground = ${colors.disabled}
label= %percentage%%
label-foreground = ${colors.disabled}
label-padding-left= 1
label-padding-right= 2

######################################
####### Date/Time #######

[module/text1]
type = custom/text
format = ""
format-foreground= ${colors.disabled}
format-font = 3

[module/text2]
type = custom/text
format= ""
format-foreground= ${colors.disabled}
format-font = 10

[module/text3]
type = custom/text
format= ""
format-foreground= ${colors.primary}
format-font = 3

[module/text4]
type = custom/text
format= ""
format-foreground= ${colors.primary}
format-font = 3

[module/text5]
type = custom/text
format= ""
format-foreground= ${colors.disabled}
format-font = 3

[module/text6]
type = custom/text
format= ""
format-foreground= ${colors.disabled}
format-font = 3

[module/date]
type = internal/date
interval = 1

date =  %I:%M %p • %a, %b %d

label = " %date% "
label-foreground = ${colors.disabled}
label-background = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
